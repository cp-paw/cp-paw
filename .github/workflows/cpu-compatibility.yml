name: CPU Compatibility

on:
  pull_request:
  push:
    branches:
      - main
      - cp-paw-nvhpc

permissions:
  contents: read

env:
  CPPAW_TOOLCHAIN: gnu
  CPPAW_USE_NVBLAS: "no"
  CPPAW_USE_NVLAMATH: "no"
  CPPAW_USE_CUFFTW: "no"
  CPPAW_USE_CUFFT: "no"
  CPPAW_USE_CUBLAS_ACC: "no"
  CPPAW_USE_CUSOLVER_ACC: "no"

jobs:
  conventional-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gfortran libfftw3-dev libopenblas-dev libopenmpi-dev \
            openmpi-bin pkg-config
      - name: Build serial and MPI binaries
        run: |
          src/Buildtools/paw_build.sh -c fast -j2 -z
          src/Buildtools/paw_build.sh -c fast_parallel -j2 -z
      - name: Reject accelerator dependencies
        run: |
          pattern='lib(cuda|cublas|cufft|cusolver|nvblas|nvlamath|torch|ftorch)'
          for binary in bin/fast/paw_fast.x \
                        bin/fast_parallel/ppaw_fast.x; do
            if ldd "${binary}" | grep -Eiq "${pattern}"; then
              echo "Unexpected accelerator dependency in ${binary}" >&2
              ldd "${binary}" >&2
              exit 1
            fi
          done
      - name: Run serial and MPI Si2 regressions
        run: |
          make -C tests/fulltests/si2 all \
            TEST=si2 PAWX="$GITHUB_WORKSPACE/bin/fast/paw_fast.x"
          make -C tests/fulltests/si2 all TEST=si2 \
            PAWX="mpirun -np 2 $GITHUB_WORKSPACE/bin/fast_parallel/ppaw_fast.x"
      - name: Check real and complex PAW constraint tolerances
        run: |
          make -C bin/Build_fast -f Makefile \
            -f ../../tests/unittests/orthogonality_tolerance/driver.mk orthogonality-tolerance-test
          python3 tests/unittests/orthogonality_tolerance/input_checks.py bin/Build_fast/paw.x
          python3 tests/unittests/orthogonality_tolerance/input_checks.py bin/Build_fast_parallel/paw.x --mpi-ranks 2
      - name: Check incremental rebuild relinks the executable
        run: python3 tests/buildtools/check_incremental_link.py bin/Build_fast
      - name: Check occupation-weighted PAW force derivatives
        run: |
          make -C bin/Build_fast -f Makefile \
            -f ../../tests/unittests/force_multiplier/driver.mk force-multiplier-test

      - name: Check reciprocal setup interpolation and derivatives
        run: |
          make -C bin/Build_fast -f Makefile \
            -f ../../tests/unittests/setup_reciprocal/driver.mk setup-reciprocal-test
      - name: Check mixed-species Hartree strain derivatives
        run: |
          make -C bin/Build_fast -f Makefile \
            -f ../../tests/unittests/hartree_strain/driver.mk hartree-strain-test
      - name: Check one-center background strain derivatives
        run: |
          make -C bin/Build_fast -f Makefile \
            -f ../../tests/unittests/background_strain/driver.mk background-strain-test
      - name: Check angular projector strain derivatives
        run: |
          make -C bin/Build_fast -f Makefile \
            -f ../../tests/unittests/projector_strain/driver.mk projector-strain-test
      - name: Check cuBLAS workspace test without CUDA
        run: |
          make -C bin/Build_fast -f Makefile \
            -f ../../tests/unittests/cublas_workspace/driver.mk cublas-workspace-test
      - name: Check optional and required nuclear forces
        run: |
          python3 tests/unittests/force_selection/input_checks.py bin/Build_fast/paw.x
          python3 tests/unittests/force_selection/input_checks.py bin/Build_fast_parallel/paw.x --mpi-ranks 2
